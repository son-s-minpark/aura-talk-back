spring:
  profiles:
    active: performance
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        generate_statistics: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.stat: DEBUG
    com.sonsminpark.auratalkback: DEBUG